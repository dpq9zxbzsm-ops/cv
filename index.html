<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولد السيرة الذاتية السريع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>إنشاء سيرة ذاتية احترافية</h1>
        <br><hr>
        <form action="generate.php" method="POST">
            <section>
                <h3>المعلومات الشخصية</h3>
                <input type="text" name="fullname" placeholder="الاسم الكامل" required>
                <input type="email" name="email" placeholder="البريد الإلكتروني" required>
                <input type="text" name="phone" placeholder="رقم الهاتف">
            </section>

            <section>
                <h3>التعليم والخبرة</h3>
                <textarea name="education" placeholder="التعليم (مثال: بكالوريوس هندسة - جامعة...)"></textarea>
                <textarea name="experience" placeholder="الخبرات العملية"></textarea>
                <textarea name="skills" placeholder="المهارات (افصل بينها بفاصلة)"></textarea>
            </section>

            <button type="submit">توليد السيرة الذاتية</button>
        </form>
    </div>
</body>
</html>
